apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-streamline-ai-deployment
  labels:
    app: hr-streamline-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-streamline-ai
  template:
    metadata:
      labels:
        app: hr-streamline-ai
    spec:
      containers:
      - name: hr-streamline-ai
        # Replace with your actual image repository and tag
        image: your-repo/hr-streamline-ai:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: hr-streamline-ai-secret
