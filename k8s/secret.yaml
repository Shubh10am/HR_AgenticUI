apiVersion: v1
kind: Secret
metadata:
  name: hr-streamline-ai-secret
type: Opaque
data:
  # These values must be Base64 encoded.
  # Use 'echo -n "your-value" | base64' to encode.
  # Example: echo -n "mongodb://user:pass@host:port/db" | base64 -> bW9uZ29kYjovL3VzZXI6cGFzc0Bob3N0OnBvcnQvZGI=
  MONGODB_URI: "your_base64_encoded_mongodb_uri"
  JWT_SECRET: "your_base64_encoded_jwt_secret"
  ENCRYPTION_KEY: "your_base64_encoded_encryption_key"
  GOOGLE_API_KEY: "your_base64_encoded_google_api_key"
  NEXT_PUBLIC_BASE_URL: "your_base64_encoded_base_url" # e.g., http://your-domain.com
  GOOGLE_CLIENT_ID: "your_base64_encoded_google_client_id"
  GOOGLE_CLIENT_SECRET: "your_base64_encoded_google_client_secret"
  BREVO_API_KEY: "your_base64_encoded_brevo_api_key"
